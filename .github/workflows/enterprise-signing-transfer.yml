name: Transfer signing configuration to Enterprise
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    environment: signing
    runs-on: ubuntu-latest
    steps:
      - name: Seal signing configuration for the approved Enterprise migration
        env:
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          RELEASE_MANIFEST_ED25519_PRIVATE_KEY: ${{ secrets.RELEASE_MANIFEST_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          python -m pip install --quiet PyNaCl==1.6.2
          python - <<'PY'
          import os,json,base64
          from nacl.public import PublicKey,SealedBox
          names=['AZURE_CERT_PROFILE', 'AZURE_CLIENT_ID', 'AZURE_SIGNING_ACCOUNT_NAME', 'AZURE_SIGNING_ENDPOINT', 'AZURE_TENANT_ID', 'RELEASE_MANIFEST_ED25519_PRIVATE_KEY']
          data={n:os.environ[n] for n in names}
          if any(not x for x in data.values()): raise SystemExit("Required signing configuration missing")
          sealed=SealedBox(PublicKey(base64.b64decode('pbJ/ogvcY0iubZja2h29sB+HnEikJfcxctDh79NrHxY='))).encrypt(json.dumps(data).encode())
          open("enterprise-signing-transfer.sealed","wb").write(sealed)
          print("Signing configuration encrypted for approved migration")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: enterprise-signing-transfer
          path: enterprise-signing-transfer.sealed
          retention-days: 1
