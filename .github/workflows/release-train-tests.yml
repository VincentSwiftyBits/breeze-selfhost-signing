name: Release Train Checks
on:
  push:
    paths: ['automation/**', '.github/workflows/**']
  pull_request:
    paths: ['automation/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography
      - run: python -m unittest discover -s automation -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/verify-manifest.test.mjs
      - run: node automation/overlays/test-web-timeout.cjs
      - run: node automation/overlays/test-workspace-auth.cjs
